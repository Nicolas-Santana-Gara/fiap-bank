server:
  port: 8081

spring:
  application:
    name: fiap-bank-plataforma-credito
  datasource:
    url: jdbc:h2:mem:plataformacredito;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
  expiration-seconds: 7200
  issuer: "fiap-bank-plataforma-credito"

fiapbank:
  core-bancario:
    base-url: ${CORE_BANCARIO_URL:http://localhost:8083}

logging:
  level:
    org.springframework.security: INFO
